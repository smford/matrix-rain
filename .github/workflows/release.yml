name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  semver-tag:
    name: Determine Semantic Version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') == false
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
      tag_created: ${{ steps.tagger.outputs.tag_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and Create SemVer Tag
        id: tagger
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: ${{ github.event.inputs.bump_type || 'patch' }}
          RELEASE_BRANCHES: main

  goreleaser:
    name: Build, Release & Publish to Homebrew
    runs-on: ubuntu-latest
    needs: [semver-tag]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.semver-tag.outputs.tag_created == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout generated tag (if automated)
        if: needs.semver-tag.outputs.tag_created == 'true'
        run: |
          git fetch --tags
          git checkout ${{ needs.semver-tag.outputs.new_tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

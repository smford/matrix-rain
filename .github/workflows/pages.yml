name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/update-docs-version.py'
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (optional, e.g. v1.0.1)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest version in docs
        run: |
          # Determine version tag from inputs, release event, or git tags
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            git fetch --tags --force
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          echo "Syncing documentation to release version: $TAG"

          # Update docs/index.html with target version
          python3 scripts/update-docs-version.py "$TAG"

          # Commit and push back to main if changed
          if ! git diff --quiet docs/index.html; then
            echo "Version changed in docs/index.html. Committing to main..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "docs: update GitHub Pages to $TAG [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "::warning::Could not push commit to main branch. Continuing Pages deployment."
          else
            echo "docs/index.html is already up to date with version $TAG."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
